<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minesweeper: UNBOUND</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #13151A;
    --panel: #1c1f26;
    --panel-border: #2a2d36;
    --text: #F1F5F9;
    --muted: #8b93a1;
    --gold: #ffd166;
    --board-bg: #CBD5E1;
    --board-hover: #F1F5F9;
    --board-revealed: #334155;
    --cell: 30px;
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 14px 56px;
  }


  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    text-align: center;
    font-size: clamp(22px, 5vw, 32px);
    margin: 0 0 6px;
  }

  #roundIntroText {
    color: #ffffff;
    font-size: 14px;
    font-style: italic;
    margin-bottom: 14px;
  }
  #roundIntroText span {
    font-weight: 400;
    font-style: italic;
  }
  #join {
    text-align: center;
    max-width: 420px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 24px 22px;
    margin-top: 8px;
  }
  #join p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
  #join input {
    padding: 12px 14px;
    width: 100%;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    margin-bottom: 14px;
  }
  #join input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  #join button, #adminBtn, #playAgainBtn, #flagModeBtn, #leaderboardBtn {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: #ffffff;
    color: #000000;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  #game { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 900px; gap: 18px; }

  #adminPanel {
    display: none;
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px dashed var(--panel-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  #adminPanel b { color: var(--text); font-family: var(--font-display); }

  #leaderboardBtn, #flagModeBtn { width: auto; padding: 8px 14px; font-size: 13px; margin-bottom: 12px; }

  #leaderboard {
    display: none;
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid #ffffff;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: left;
  }
  #leaderboard h3 { margin: 0 0 10px; font-family: var(--font-display); color: #ffffff; font-weight: 800; font-size: 14px; }
  #leaderboard ol { margin: 0; padding-left: 20px; font-size: 14px; }
  #leaderboard li { margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
  #leaderboard li { color: #ffffff; font-weight: 700; }
  #leaderboard li span.pts { color: #ffffff; font-weight: 700; }

  #modeSelect { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .mode-btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); font-weight: bold; cursor: pointer; font-size: 13px; }
  .mode-btn.mode-active { background: #ffffff; color: #000000; border-color: #ffffff; }

  #personalScore { font-family: var(--font-display); font-weight: 700; margin-bottom: 12px; }

  #boardWrap { width: 100%; overflow-x: auto; display: flex; justify-content: center; padding-bottom: 8px; }
  #board {
    display: grid;
    gap: 3px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
    width: max-content;
  }
  .cell {
    width: var(--cell); height: var(--cell);
    background: var(--board-bg);
    color: #1e293b;
    border: none;
    font-weight: 700;
    font-size: calc(var(--cell) * 0.42);
    font-family: var(--font-body);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .cell:hover:not(:disabled) { background: var(--board-hover); }
  .cell:disabled { cursor: default; }
  .cell.revealed { background: var(--board-revealed); color: var(--text); }
  .cell.flagged { background: #ffffff; }

  #result { font-family: var(--font-display); font-size: clamp(18px, 4vw, 24px); font-weight: 800; color: var(--gold); margin-top: 16px; text-align: center; }

  @media (max-width: 480px) { :root { --cell: 22px; } #join { padding: 20px 16px; } }
</style>
</head>
<body>

<h1>💣 Minesweeper: UNBOUND</h1>

<div id="join">
  <p>Every safe tile = +1 point. Every mine = -1 point. Your total score climbs the leaderboard.</p>
  <input id="nameInput" placeholder="Your Discord name" maxlength="24" />
  <button onclick="joinGame()">JOIN GAME</button>
</div>

<div id="game" style="display:none">

  <div id="adminPanel">
    <b>Host Panel</b>
    <p style="margin:8px 0;">Wipes the leaderboard back to zero for everyone.</p>
    <button id="adminBtn" onclick="resetLeaderboard()">Reset Leaderboard</button>
  </div>

  <button id="leaderboardBtn" onclick="toggleLeaderboard()">🏆 Show Leaderboard</button>

  <div id="leaderboard">
    <h3>TOP 10</h3>
    <ol id="lbList"></ol>
  </div>

  <div id="roundIntro">
    <p id="roundIntroText"><span>⚠️ Border Alert: Left connects to right, top connects to bottom.</span></p>
    <div id="modeSelect">
      <button id="modeNormalBtn" class="mode-btn mode-active" onclick="setGameMode('normal')">Normal Mode</button>
      <button id="modeExpertBtn" class="mode-btn" onclick="setGameMode('expert')">Expert Mode ☠️</button>
    </div>
    <button id="playAgainBtn" onclick="startRound()">START ROUND</button>
  </div>

  <div id="roundArea" style="display:none">
    <div id="personalScore">Your score this round: <span id="roundScoreVal">0</span></div>
    <button id="flagModeBtn" onclick="toggleFlagMode()">🚩 Switch to Flag</button>
    <div id="boardWrap"><div id="board"></div></div>
  </div>

  <div id="result"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCM6PDC1-IVSJVhj8d68uCLF8hedb8IyB8",
    authDomain: "minesweeper-redvsblue.firebaseapp.com",
    databaseURL: "https://minesweeper-redvsblue-default-rtdb.firebaseio.com",
    projectId: "minesweeper-redvsblue",
    storageBucket: "minesweeper-redvsblue.firebasestorage.app",
    messagingSenderId: "173545402444",
    appId: "1:173545402444:web:fce9ed6048878e08fb84e9"
  };

  const ADMIN_CODE = "1234";

  // 👇 Cambia estos tres números para ajustar la dificultad de cada ronda
   const ROWS = 12;
  const COLS = 14;
  const MINES = 22;

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const playersRef = ref(db, "players/current");

  let playerId = localStorage.getItem("ms_id");
  if (!playerId) {
    playerId = crypto.randomUUID();
    localStorage.setItem("ms_id", playerId);
  }

  const params = new URLSearchParams(location.search);
  if (params.get("admin") === ADMIN_CODE) {
    document.getElementById("adminPanel").style.display = "block";
  }

  window.joinGame = function () {
    const name = document.getElementById("nameInput").value.trim();
    if (name) localStorage.setItem("ms_name", name);
    const finalName = localStorage.getItem("ms_name") || "Player";

    runTransaction(ref(db, "players/current/" + playerId), (current) => {
      const player = current || { score: 0 };
      player.name = finalName;
      if (!player.score) player.score = 0;
      return player;
    });

    document.getElementById("join").style.display = "none";
    document.getElementById("game").style.display = "flex";
  };

  if (localStorage.getItem("ms_name")) {
    joinGame();
  }

  window.resetLeaderboard = function () {
    set(playersRef, {});
  };

  let leaderboardOpen = false;
  window.toggleLeaderboard = function () {
    leaderboardOpen = !leaderboardOpen;
    document.getElementById("leaderboard").style.display = leaderboardOpen ? "block" : "none";
    document.getElementById("leaderboardBtn").textContent = leaderboardOpen ? "🏆 Hide Leaderboard" : "🏆 Show Leaderboard";
  };

  onValue(playersRef, (snap) => {
    const players = snap.val() || {};
    const top10 = Object.values(players)
      .sort((a, b) => (b.score || 0) - (a.score || 0))
      .slice(0, 10);

    const list = document.getElementById("lbList");
    list.innerHTML = "";
    top10.forEach((p) => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${p.name || "Player"}</span><span class="pts">${p.score || 0}</span>`;
      list.appendChild(li);
    });
  });

  // --- Modo toroidal (Expert Mode): bordes conectados + minas mas cerca de los bordes ---
  let toroidalMode = false;
  window.setGameMode = function (mode) {
    toroidalMode = (mode === "expert");
    document.getElementById("modeNormalBtn").classList.toggle("mode-active", !toroidalMode);
    document.getElementById("modeExpertBtn").classList.toggle("mode-active", toroidalMode);
  };

  function getNeighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        let rr = r + dr, cc = c + dc;
        if (toroidalMode) {
          rr = ((rr % ROWS) + ROWS) % ROWS;
          cc = ((cc % COLS) + COLS) % COLS;
        } else if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) {
          continue;
        }
        out.push([rr, cc]);
      }
    }
    return out;
  }

  function pickWeightedMineIndices(count) {
    const weights = [];
    const cx = (ROWS - 1) / 2, cy = (COLS - 1) / 2;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const dr = Math.abs(r - cx) / (ROWS / 2);
        const dc = Math.abs(c - cy) / (COLS / 2);
        const dist = Math.max(dr, dc);
        weights.push(0.15 + dist * dist);
      }
    }
    const chosen = new Set();
    while (chosen.size < count) {
      let total = 0;
      for (let i = 0; i < weights.length; i++) if (!chosen.has(i)) total += weights[i];
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        if (chosen.has(i)) continue;
        r -= weights[i];
        if (r <= 0) { chosen.add(i); break; }
      }
    }
    return chosen;
  }

  // --- Ronda individual ---
  let cells = [];
  let roundActive = false;
  let roundScore = 0;

  function buildRawBoard() {
    const size = ROWS * COLS;
    const board = Array.from({ length: size }, () => ({ mine: false, adjacent: 0, revealed: false, flagged: false }));
    if (toroidalMode) {
      const mineIndices = pickWeightedMineIndices(MINES);
      mineIndices.forEach((idx) => { board[idx].mine = true; });
    } else {
      let placed = 0;
      while (placed < MINES) {
        const idx = Math.floor(Math.random() * size);
        if (!board[idx].mine) { board[idx].mine = true; placed++; }
      }
    }
    const at = (r, c) => r * COLS + c;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (board[at(r, c)].mine) continue;
      let n = 0;
      for (const [rr, cc] of getNeighbors(r, c)) {
        if (board[at(rr, cc)].mine) n++;
      }
      board[at(r, c)].adjacent = n;
    }
    return board;
  }

  // Revela en cascada SOBRE UN TABLERO DADO (sirve tanto para el juego real
  // como para las pruebas del solver). Muta el tablero y devuelve los indices nuevos.
  function floodFillOn(board, startRow, startCol) {
    const toReveal = new Set();
    const stack = [[startRow, startCol]];
    while (stack.length) {
      const [r, c] = stack.pop();
      const idx = r * COLS + c;
      if (toReveal.has(idx) || board[idx].revealed) continue;
      toReveal.add(idx);
      board[idx].revealed = true;
      if (board[idx].adjacent === 0 && !board[idx].mine) {
        for (const [rr, cc] of getNeighbors(r, c)) {
          const nIdx = rr * COLS + cc;
          if (!board[nIdx].revealed && !toReveal.has(nIdx)) stack.push([rr, cc]);
        }
      }
    }
    return toReveal;
  }

  // Intenta resolver el tablero SOLO con logica (sin adivinar). Devuelve true
  // si logra revelar todas las celdas seguras usando deduccion pura.
  function solveNoGuess(board, startRow, startCol) {
    const total = ROWS * COLS;
    const safeTotal = board.filter((c) => !c.mine).length;
    floodFillOn(board, startRow, startCol);

    function neighborsIdx(idx) {
      const r = Math.floor(idx / COLS), c = idx % COLS;
      return getNeighbors(r, c).map(([rr, cc]) => rr * COLS + cc);
    }

    let progress = true;
    let guard = 0;
    while (progress && guard < 40) {
      progress = false;
      guard++;

      for (let idx = 0; idx < total; idx++) {
        const cell = board[idx];
        if (!cell.revealed || cell.mine) continue;
        const neighbors = neighborsIdx(idx);
        const hidden = neighbors.filter((n) => !board[n].revealed && !board[n].flagged);
        const flaggedCount = neighbors.filter((n) => board[n].flagged).length;
        if (hidden.length === 0) continue;

        if (flaggedCount === cell.adjacent) {
          hidden.forEach((n) => {
            const r = Math.floor(n / COLS), c = n % COLS;
            if (floodFillOn(board, r, c).size > 0) progress = true;
          });
        } else if (cell.adjacent - flaggedCount === hidden.length) {
          hidden.forEach((n) => {
            if (!board[n].flagged) { board[n].flagged = true; progress = true; }
          });
        }
      }

      const constraints = [];
      for (let idx = 0; idx < total; idx++) {
        const cell = board[idx];
        if (!cell.revealed || cell.mine) continue;
        const neighbors = neighborsIdx(idx);
        const hidden = neighbors.filter((n) => !board[n].revealed && !board[n].flagged);
        const flaggedCount = neighbors.filter((n) => board[n].flagged).length;
        if (hidden.length > 0) constraints.push({ hidden: new Set(hidden), need: cell.adjacent - flaggedCount });
      }

      for (let i = 0; i < constraints.length; i++) {
        for (let j = 0; j < constraints.length; j++) {
          if (i === j) continue;
          const A = constraints[i], B = constraints[j];
          if (A.hidden.size >= B.hidden.size) continue;
          let isSubset = true;
          for (const h of A.hidden) if (!B.hidden.has(h)) { isSubset = false; break; }
          if (!isSubset) continue;

          const diffCells = [...B.hidden].filter((h) => !A.hidden.has(h));
          const diffNeed = B.need - A.need;

          if (diffNeed === 0) {
            diffCells.forEach((n) => {
              const r = Math.floor(n / COLS), c = n % COLS;
              if (floodFillOn(board, r, c).size > 0) progress = true;
            });
          } else if (diffNeed === diffCells.length) {
            diffCells.forEach((n) => {
              if (!board[n].flagged) { board[n].flagged = true; progress = true; }
            });
          }
        }
      }
    }

    const revealedSafe = board.filter((c) => !c.mine && c.revealed).length;
    return revealedSafe === safeTotal;
  }

  // Genera tableros hasta encontrar uno resoluble sin adivinar (probando desde el centro).
  function generateSolvableBoard() {
    const startRow = Math.floor(ROWS / 2);
    const startCol = Math.floor(COLS / 2);
    const startIdx = startRow * COLS + startCol;

    for (let attempt = 0; attempt < 150; attempt++) {
      const board = buildRawBoard();
      if (board[startIdx].mine) continue;
      const scratch = board.map((c) => ({ ...c }));
      if (solveNoGuess(scratch, startRow, startCol)) return board;
    }
    return buildRawBoard(); // ultimo recurso, muy poco probable que se use
  }

  let flagMode = false;
  const MINE_FLAG_POINTS = 2; // puntos por cada mina marcada correctamente
  const CLEAR_BOARD_BONUS = 56; // puntos por completar el tablero entero

  window.toggleFlagMode = function () {
    flagMode = !flagMode;
    document.getElementById("flagModeBtn").textContent = flagMode ? "⛏️ Switch to Dig" : "🚩 Switch to Flag";
  };

  window.cellClick = function (row, col) {
    if (flagMode) toggleFlag(row, col);
    else revealCell(row, col);
  };

  function toggleFlag(row, col) {
    const idx = row * COLS + col;
    if (!roundActive || cells[idx].revealed) return;
    cells[idx].flagged = !cells[idx].flagged;

    if (cells[idx].mine) {
      roundScore += cells[idx].flagged ? MINE_FLAG_POINTS : -MINE_FLAG_POINTS;
      document.getElementById("roundScoreVal").textContent = roundScore;
    }
    renderBoard();
  }

  window.startRound = function () {
    cells = generateSolvableBoard();
    roundActive = true;
    roundScore = 0;

    document.getElementById("roundIntro").style.display = "none";
    document.getElementById("roundArea").style.display = "block";
    document.getElementById("result").textContent = "";
    document.getElementById("roundScoreVal").textContent = "0";
    renderBoard();
  };

  window.revealCell = function (row, col) {
    if (!roundActive) return;
    const idx = row * COLS + col;
    if (cells[idx].revealed || cells[idx].flagged) return;

     const toReveal = floodFillOn(cells, row, col);
    let hitMine = false;
    toReveal.forEach((i) => {
      cells[i].revealed = true;
      if (cells[i].mine) hitMine = true;
    });

    document.getElementById("roundScoreVal").textContent = roundScore;
    renderBoard();

    if (hitMine) { endRound(false); return; }
    const remainingSafe = cells.filter(c => !c.mine && !c.revealed).length;
    if (remainingSafe === 0) endRound(true);
  };

  function endRound(won) {
    roundActive = false;
    if (won) {
      cells.forEach((c) => {
        if (c.mine && !c.flagged) roundScore += MINE_FLAG_POINTS;
      });
    }
    let finalScore = won ? roundScore + CLEAR_BOARD_BONUS : roundScore;
    runTransaction(ref(db, "players/current/" + playerId), (current) => {
      const player = current || { name: localStorage.getItem("ms_name") || "Player", score: 0 };
      player.score = (player.score || 0) + finalScore;
      return player;
    });

    const result = document.getElementById("result");
    result.textContent = won
      ? `YOU CLEARED THE BOARD! +${finalScore} points`
      : `BOOM! You scored ${finalScore} points before hitting a mine.`;

    document.getElementById("roundIntroText").querySelector("span").textContent = "Ready for another round?";
    document.getElementById("roundIntro").style.display = "block";
    document.getElementById("roundArea").style.display = "none";
  }

  function renderBoard() {
    const board = document.getElementById("board");
    board.style.gridTemplateColumns = `repeat(${COLS}, var(--cell))`;
    board.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cells[r * COLS + c];
        const btn = document.createElement("button");
        btn.className = "cell" + (cell.revealed ? " revealed" : "") + (cell.flagged ? " flagged" : "");
        btn.disabled = cell.revealed || !roundActive;
        if (cell.revealed) btn.textContent = cell.mine ? "💥" : (cell.adjacent || "");
        else if (cell.flagged) btn.textContent = "🚩";
        btn.onclick = () => cellClick(r, c);
        btn.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
        board.appendChild(btn);
      }
    }
  }
</script>
</body>
</html>
